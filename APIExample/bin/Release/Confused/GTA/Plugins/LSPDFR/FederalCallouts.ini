[Main]
//This is used for starting the drug deal
StartKey=Y
//Add the model name of modded in marked cars here, if you have none just leave it as is
MarkedCars=none
//Controls whether or not the repair module is enabled.
EnableRepairs=true

[Player]
//Your name when you are using the city, sheriff or highway models
LocalName=Officer
//Your name for any other models
FederalName=Agent

//Settings for individual callouts, to disable callouts set Enable to false
//For the probability option, numbers range from 0 to 5.
[ArmoredCarRobbery]
Probability=2
Enable=true

[PotentialDrugDeal]
Probability=4
Enable=true

[ExecuteArrestWarrant]
Probability=4
Enable=true

[Assassination]
Probability=4
Enable=true
//Maximum and minimum times that it will take for the assassin to attack the victim, in seconds
MaxStrikeTime=300
MinStrikeTime=60

[PrisonerEscaped]
Probability=3
Enable=true

//this callout will be overhauled soon, enable if you want (just keeping it here on the off chance someone liked it and wants it between updates)
[Kidnapping]
Probability=2
Enable=true
//How accurate is this list of suspects? This is the % chance that each suspect has
//the kidnapped victim. Set to 100 for it to be right every time.
//DO NOT SET OVER 100
PercentAccurate=35

//this will be ready in the next release :D
[BombSting]
Probability=2
Enable=true

//this callout not implemented yet
[OrganizedRetailCrime]
Probability=3
Enable=false

//this callout not fully implemented yet, ready by next release as well
[Stingray]
Probability=4
Enable=false